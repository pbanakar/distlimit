server:
  port: 8080

spring:
  data:
    redis:
      host: localhost
      port: 6379

rate-limiter:
  # Legacy top-level values are used as defaults when policies are omitted.
  algorithm: redis-token-bucket
  capacity: 10
  refill-rate: 1.0
  window-size-millis: 60000
  fail-open: true
  policies:
    default:
      capacity: 10
      refill-rate: 1.0
    free:
      capacity: 100
      refill-rate: 1.6667
    premium:
      capacity: 1000
      refill-rate: 16.6667

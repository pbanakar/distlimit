# Nginx load balancer config — round-robin across 3 rate limiter instances.
# Round-robin is the default upstream strategy in Nginx: each new connection
# goes to the next server in the list. This simulates real production where
# requests from the same client land on different service instances.

upstream ratelimiter {
    server app1:8080;
    server app2:8080;
    server app3:8080;
}

server {
    listen 80;

    location / {
        proxy_pass http://ratelimiter;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

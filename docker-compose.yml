services:
  # ── Redis: shared state store ──
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── 3 rate limiter instances (same image, different container names) ──
  # Each connects to the shared Redis. In production these would be separate
  # pods/VMs behind a load balancer — here Docker Compose simulates that.
  app1:
    build: .
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - RATE_LIMITER_CAPACITY=10
      - RATE_LIMITER_REFILL_RATE=0.001
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app2:
    build: .
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - RATE_LIMITER_CAPACITY=10
      - RATE_LIMITER_REFILL_RATE=0.001
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app3:
    build: .
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - RATE_LIMITER_CAPACITY=10
      - RATE_LIMITER_REFILL_RATE=0.001
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Nginx load balancer ──
  # Sits in front of all 3 instances, round-robin distributes requests.
  # This is the single entry point for the load test.
  nginx:
    image: nginx:alpine
    ports:
      - "9090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy
